<title>Registrar Journey Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: fixed 4:3 stage (1200x900) scaled to the window, no page scroll. Journey matrix: six stages across, six participant types down, decision gates under the stage names, outputs and decision-makers under the grid, acts along the bottom. Every item opens its detail on click and lights up what it connects to. */
:root{
  --bg1:#e6f3ee; --bg2:#eef5fb; --panel:#ffffff; --ink:#12284a; --muted:#5b6b82; --line:#c9dde6;
  --blue:#1a6fd0; --blue-soft:#e4effb; --green:#1b9a55; --green-soft:#e3f5ea; --amber:#c0831a; --amber-soft:#fcf0d8;
  --navy:#14305c; --chip:#f3f8fb; --shadow:0 8px 28px rgba(20,48,92,.22);
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#0b1a1b; --bg2:#0d1826; --panel:#12262b; --ink:#e6f0f2; --muted:#98adb2; --line:#28454c;
  --blue:#5aa6ff; --blue-soft:#15314f; --green:#3fcf84; --green-soft:#12362a; --amber:#e8ab45; --amber-soft:#3a2d12;
  --navy:#a4c8ff; --chip:#183339; --shadow:0 8px 28px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg1:#0b1a1b; --bg2:#0d1826; --panel:#12262b; --ink:#e6f0f2; --muted:#98adb2; --line:#28454c;
  --blue:#5aa6ff; --blue-soft:#15314f; --green:#3fcf84; --green-soft:#12362a; --amber:#e8ab45; --amber-soft:#3a2d12;
  --navy:#a4c8ff; --chip:#183339; --shadow:0 8px 28px rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:var(--font);font-size:12px;line-height:1.3}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-radius:8px}

#viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#stage{width:1200px;height:900px;position:relative;flex:none;transform-origin:center center;display:grid;grid-template-rows:50px minmax(0,1fr) auto 18px;gap:8px;padding:10px 12px 6px}

.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:9px 12px;min-width:0}
.panel.blue{border-color:var(--blue)}
.pt{font-size:13px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--navy);white-space:nowrap}
.pt em{font-style:normal;color:var(--blue)}
.psub{color:var(--muted);font-size:11px;font-style:italic}

.top{display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.top h1{font-size:22px;font-weight:800;color:var(--navy);padding-left:10px;border-left:4px solid var(--green);white-space:nowrap}
.top h1 small{font-size:12px;font-weight:600;color:var(--muted);margin-left:10px;letter-spacing:.02em}
.brand{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:15px;line-height:1;color:var(--navy);position:relative;padding-left:10px}
.logo::before{content:"";position:absolute;left:0;top:-2px;width:7px;height:7px;background:var(--green)}
.logo b{color:var(--green)}
.tb{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600}
.tb:hover{border-color:var(--blue)}

/* journey matrix */
.matrix{height:100%;display:grid;grid-template-columns:140px repeat(6,minmax(0,1fr));grid-template-rows:auto auto repeat(6,minmax(0,1fr)) auto auto;gap:5px;min-height:0}
.lab{align-self:center;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-right:6px;text-align:right}
.stg{border:1.5px solid var(--blue);background:var(--blue-soft);border-radius:12px;padding:5px 8px 6px;text-align:left;display:grid;gap:1px;position:relative}
.stg b{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--navy);display:flex;gap:6px;align-items:center}
.stg b i{font-style:normal;flex:none;width:19px;height:19px;border-radius:50%;background:var(--navy);color:var(--panel);display:grid;place-items:center;font-size:11px}
.stg span{font-size:10.5px;color:var(--muted);line-height:1.2}
.stg[data-id=st6]::after{display:none}
.stg::after{content:"";position:absolute;right:-8px;top:50%;width:8px;height:8px;border-top:2.5px solid var(--green);border-right:2.5px solid var(--green);transform:translateY(-50%) rotate(45deg);z-index:2}
.stg:hover,.rowh:hover{border-color:var(--navy)}

.gates{display:flex;flex-direction:column;gap:3px;align-items:stretch;justify-content:center}
.gate{display:flex;align-items:center;gap:6px;border:1.5px dashed var(--amber);background:var(--amber-soft);border-radius:9px;padding:2px 7px;font-size:10.5px;font-weight:600;text-align:left;line-height:1.15}
.gate::before{content:"";flex:none;width:8px;height:8px;background:var(--amber);transform:rotate(45deg)}
.gate:hover{border-style:solid}

.rowh{border:1.5px solid var(--green);background:var(--green-soft);border-radius:12px;padding:5px 8px;display:flex;gap:7px;align-items:center;text-align:left}
.ico{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel);color:var(--green);display:grid;place-items:center}
.ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rowh b{font-size:11.5px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.01em;line-height:1.15}

.cell{border:1.5px solid var(--line);background:var(--panel);border-radius:11px;padding:5px 7px 5px 17px;text-align:left;position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;transition:opacity .12s,background .12s,border-color .12s}
.cell::before{content:"";position:absolute;left:6px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.cell.A::before{background:var(--green)} .cell.R::before{background:var(--amber)}
.cell.dr{border-style:dashed}
.cell b{font-size:11.5px;font-weight:600;line-height:1.2;color:var(--ink)}
.cell u{text-decoration:none;font-size:10.5px;font-weight:700;color:var(--green);line-height:1.15}
.cell:hover{border-color:var(--blue);background:var(--blue-soft)}

.foot{border:1.5px solid var(--line);background:var(--chip);border-radius:10px;padding:3px 7px;font-size:10.5px;text-align:left;line-height:1.2;font-weight:600}
.foot.dec{border-color:var(--navy)}
.foot:hover{border-color:var(--blue);background:var(--blue-soft)}

/* bottom acts strip */
.acts{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;padding:7px 12px}
.chips{display:flex;flex-wrap:wrap;gap:4px 5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--chip);border-radius:9px;padding:2px 8px;font-size:11.5px;font-weight:500;text-align:left;line-height:1.2;transition:opacity .12s,background .12s,border-color .12s}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none}
.chip.dr{border-style:dashed}
.chip:hover{border-color:var(--blue);background:var(--blue-soft)}

/* selection */
body.has-sel #stage .cell:not(.rel):not(.sel),body.has-sel #stage .stg:not(.rel):not(.sel),body.has-sel #stage .rowh:not(.rel):not(.sel),body.has-sel #stage .gate:not(.rel):not(.sel),body.has-sel #stage .foot:not(.rel):not(.sel),body.has-sel #stage .chip:not(.rel):not(.sel){opacity:.3}
.rel.cell,.rel.stg,.rel.rowh,.rel.chip,.rel.foot{background:var(--blue-soft);border-color:var(--blue)}
.rel.gate{border-style:solid}
.sel{border-color:var(--navy)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 40%,transparent)}

.legend{display:flex;gap:4px 18px;align-items:center;font-size:11px;color:var(--muted);padding-left:6px;white-space:nowrap}
.legend b{color:var(--ink)} .legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%} .dash{width:24px;height:12px;border:1.5px dashed var(--muted);border-radius:5px}
.dia{width:9px;height:9px;background:var(--amber);transform:rotate(45deg)}

/* detail panel */
#info{position:absolute;top:62px;bottom:30px;width:420px;background:var(--panel);border:2px solid var(--navy);border-radius:16px;box-shadow:var(--shadow);z-index:10;display:none;flex-direction:column;overflow:hidden}
#info.on{display:flex} #info.right{right:12px} #info.left{left:12px}
.ih{padding:12px 14px 10px;border-bottom:1.5px solid var(--line);position:relative;display:grid;gap:3px}
.ik{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--green)}
.ih h2{font-size:17px;font-weight:800;color:var(--navy);line-height:1.15;padding-right:30px;text-wrap:balance}
.ih p{color:var(--muted);font-size:12px}
.xb{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--chip);font-size:16px;line-height:1;padding:0}
.ib{overflow:auto;padding:10px 14px 14px;display:grid;gap:11px;align-content:start}
.ib h3{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ib ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.ib li{position:relative;padding-left:13px;font-size:12px}
.ib li::before{content:"";position:absolute;left:1px;top:.5em;width:5px;height:5px;border-radius:50%;background:var(--green)}
.ib p.t{font-size:12px}
.basis li::before{background:var(--blue)}
.basis button{border:0;background:var(--blue-soft);color:var(--navy);border-radius:5px;padding:0 5px;font-size:11px;font-weight:700;margin-right:4px}
.flag{background:var(--amber-soft);border:1.5px dashed var(--amber);border-radius:10px;padding:7px 10px;font-size:11.5px}
.flag b{color:var(--amber)}
.branch{border:1.5px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;background:var(--chip)}
.branch b{color:var(--navy);display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
#info .chip{opacity:1!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="viewport">
<div id="stage">
  <header class="panel top">
    <h1>REGISTRAR'S JOURNEY MAP<small>FROM APPLICATION TO EXIT, BY TYPE OF PARTICIPANT</small></h1>
    <div class="brand"><button class="tb" id="clear" type="button">Clear</button><button class="tb" id="theme" type="button">Theme</button><div class="logo">Enterprise<br><b>Uzbekistan</b></div></div>
  </header>

  <section class="panel blue" style="padding:8px 10px;min-height:0"><div class="matrix" id="mx"></div></section>

  <section class="panel blue acts">
    <div><div class="pt">ACTS</div><div class="psub">Click to see where each is used</div></div>
    <div class="chips" id="acts"></div>
  </section>

  <div class="legend">
    <b>Applicability:</b>
    <span><i class="dot" style="background:var(--blue)"></i>Foundational (all participants)</span>
    <span><i class="dot" style="background:var(--green)"></i>Activity-based</span>
    <span><i class="dot" style="background:var(--amber)"></i>Relevance-based</span>
    <span><i class="dash"></i>Caveat: draft, role to confirm</span>
    <span><i class="dia"></i>Decision gate</span>
    <span>* see detail</span>
  </div>

  <aside id="info" aria-live="polite">
    <div class="ih"><div class="ik" id="i-k"></div><h2 id="i-t"></h2><p id="i-s"></p><button class="xb" id="xb" type="button" aria-label="Close">&times;</button></div>
    <div class="ib" id="i-b"></div>
  </aside>
</div>
</div>

<script>
var K={stage:'Journey stage',row:'Type of participant',cell:'Step',gate:'Decision gate',out:'Output',dec:'Who decides',act:'Act',pend:'Referenced act, file not yet received',body:'Decision-making body'};
var SHORT={law:'Law of the IDTC',op:'Operating Regs',co:'Companies Regs',pa:'Permitted Activities',pr:'Participants Regs',ce:'Certificates Rules',dmp:'Decision-Making',ps:'Public Services',reg:'Public Register'};
var I={};
function N(id,kind,t,sum,o){I[id]=Object.assign({id:id,kind:kind,t:t,sum:sum,rel:[],r:[]},o||{})}

/* ===== acts ===== */
N('law','act','Constitutional Law on the IDTC','Adopted 4 Aug 2026, approved by the Senate 8 Aug 2026.',{ap:['Does not name the Registrar; the office is created by the Operating Regulations (Art. 6).','Art. 22–23 Residents and Register of Participants; Art. 26–30 investors; Art. 33 accredited partners; Art. 68 services of the Center\'s bodies; Art. 78–79 liability.']});
N('op','act','Operating Regulations','The core act of the Registrar: powers, Certificates, supervision, enforcement, strike-off.',{ap:['Art. 6–7 Registrar; Art. 9 Certificates, Permissions, Exemptions; Art. 10–18 names, office, changes, Confirmation Statement.','Part 5 inspections, directions, strike-off; Art. 38–39 censures and fines (Administration).']});
N('co','act','Companies Regulations','Company code administered by the Registrar.',{ap:['Incorporation, types of company, SPV and Holding Company (Part 11), Recognised Companies (Part 12), transfer of incorporation (Part 13), strike-off and restoration.']});
N('pa','act','Permitted Activities Regulations','Draft. The List of Permitted Activities and the conditions for each.',{draft:1,ap:['Resident acts only within the activities written in its Certificate; new activity needs prior approval.','Substance, separate accounting, IP and sandbox conditions.']});
N('pr','act','Regulations on Participants','Draft. Admission, registration, rights and duties of Residents and Investors.',{draft:1,ap:['Application, fit and proper test, beneficial ownership, decision, Public Register, 12–36 month certificates.']});
N('ce','act','Rules on Certificates, Permissions and Exemptions','Draft. Procedure for the five instruments the Registrar issues.',{draft:1,ap:['Certificate, Permission, Accreditation Permit, Investor Certificate, Exemption.','Common procedure: submit, completeness, assessment, decision, fees, signed issue.']});
N('dmp','act','Decision-Making Procedures','How the Registrar decides: notice, hearing, reasons, publication.',{ap:['Ten principles; case file; silence is not approval; heavy measures go to the Administration with the case file.']});
N('ps','act','Regulations on Public Services','Temporary. State services through the Center\'s platform.',{ap:['Unified Portal, "Licence" system, OneID registration of foreign Residents, electronic documents equal to paper.']});
N('reg','act','Public Register','Official record kept by the Registrar.',{ap:['Name, number, legal form, status, validity, permitted activities, office, email. Separate registers of Permissions, Accreditation Permits, Exemptions, auditors.']});
N('p_fees','pend','Rules on Fees and Fines','Referenced for fees, late-renewal fines and measures of liability. File not yet received.',{draft:1,ap:['Needed for exact amounts and the fines procedure.']});
N('p_inc','pend','Rules on Application for Incorporation','Referenced for forms, Standard Articles and procedure. File not yet received.',{draft:1,ap:['Needed for incorporation details.']});
N('p_inv','pend','Investment Regulations','Referenced for investor categories and status. File not yet received.',{draft:1,ap:['Needed for investor validity, renewal and exit.']});
N('p_oth','pend','Tax & Customs, Data Protection, AML/CFT','Other special acts. Files not yet received.',{draft:1,ap:['The Registrar does not set tax consequences; AML/CFT compliance is a Registrar objective.']});

/* ===== stages (columns) ===== */
var STAGES=[
['st1','Enter','Application and incorporation','The participant applies; the Registrar checks and registers.',
 ['Applications go only through the official platform; the Registrar acknowledges and assigns a case number.','Completeness check, screening of owners, sanctions, reputation and real presence.','Decision, certificate of incorporation or status, entry in the Public Register.'],[['op','Art. 8, 11–12'],['co','Art. 11–12'],['pr','Art. 13–20'],['dmp','Art. 13–18']]],
['st2','Certify','Which activities are allowed','The Registrar decides what the participant may do and on what conditions.',
 ['Each activity is matched to the List; one principal activity, others as separate endorsements.','Another regulator\'s licence is recorded; the Certificate never replaces it.','Valid 12 to 36 months, 12 by default.'],[['op','Art. 9'],['ce','Art. 7–9, 13–18, Part 4'],['pa','Art. 6–8']]],
['st3','Operate','Duties while active','Keep office, registers and activity inside the Certificate.',
 ['Registered office and email in the Center; principal business carried on in the Center.','Status and activity endorsements are shown in the Public Register.','Notices are served electronically through the digital account.'],[['op','Art. 13–15, 18'],['pr','Art. 21, 24–25']]],
['st4','Renew & change','Keep the record true','Renewal, Confirmation Statement and changes in details.',
 ['Renew before expiry with the fee and a Confirmation Statement.','Report changes within 30 days; new standalone activity needs prior approval.','Late renewal within 30 days of expiry carries no fine; later, an automatic fine.'],[['op','Art. 9(9)–(11), 16–17'],['ce','Art. 24, 34'],['pa','Art. 7(4)–(5)']]],
['st5','Supervise & enforce','Check and correct','Risk-based monitoring and graded measures.',
 ['Information requests, inspection, directions, undertakings, variation or suspension.','Censures, fines and loss of status are decided by the Administration on the Registrar\'s case file.','Decisions can be taken to Court.'],[['op','Art. 23–32, 37–40'],['dmp','Art. 7, 19–27'],['law','Art. 78–79']]],
['st6','Exit','Strike-off and restoration','End the record properly, or restore it through the Court.',
 ['Strike-off after notice and 3 months to show cause; the entity is dissolved.','Officers stay liable; records kept 6 years.','Only the Court can restore.'],[['op','Art. 33–34'],['co','Art. 151']]]
];
STAGES.forEach(function(s,i){N(s[0],'stage',(i+1)+'. '+s[1],s[3],{ap:s[4],r:s[5],sub:s[2],num:i+1})});

/* ===== participant types (rows) ===== */
var ROWS=[
['rw1','Private / Public Company','op','The ordinary operating company.',['Private Company: limited by shares, by guarantee or unlimited; no public offers. Public Company may offer shares and has stricter rules.','Needs a Certificate of Permitted Activities before it starts business.'],[['co','Art. 7, 11–13, 26–31']]],
['rw2','Holding & HQ','hold','Holds shares, IP or interests, or runs headquarters functions.',['A prescribed type under Companies Regs Part 11; regulated activity only with separate authorisation.','Substance proportionate to the purpose; separate accounts for activity in and outside the Center.'],[['co','Part 11'],['pa','Art. 6(9),(11),(12), 9(13)']]],
['rw3','SPV / Project structure','spv','A Private Company with a narrow approved purpose. Not a separate legal form.',['Objects limited to the approved purpose; no unrelated commercial activity.','Registrar can revoke the SPV designation.'],[['co','Part 11, SPV']]],
['rw4','Recognised Company','rec','Branch or representative office of a foreign company; also continuation of a foreign company.',['A Foreign Company may not carry on business in the Center unless registered (Part 12) or continued (Part 13).','Mergers with a Foreign Company need Registrar consent.'],[['co','Part 12–13, Art. 113']]],
['rw5','Investor','inv','Institutional, start-up, resident-investor, infrastructure investor.',['Investor Certificate records status and category and does not authorise activity.','Start-up investors need no separate registration by default.'],[['law','Art. 26–30'],['ce','Part 7'],['pr','Art. 9–11']]],
['rw6','Accredited partner / permit holder','ip','Accredited partners, non-residents with Permission, Exempt persons, auditors.',['Accredited partners are not Participants and get no benefits.','Permission, Exemption and Accreditation Permit each have their own term.'],[['law','Art. 33, 69'],['ce','Parts 5, 6, 8'],['op','Art. 9(4)–(5), 19–21']]]
];
ROWS.forEach(function(r){N(r[0],'row',r[1],r[3],{ap:r[4],r:r[5],icon:r[2]})});

/* ===== cells: [row,col, label, badge, applicability, dashed, participant, registrar, time, decides, basis, flag] ===== */
var C=[
['rw1','st1','Incorporation','1 business day*','F',0,'Files the application with Articles of Association on the platform.','Checks completeness, screens owners, issues the certificate of incorporation and registered number, enters the name in the Public Register.','* A standard electronic application with no extra checks is decided 1 business day after completeness. Other complete applications: 15 business days.','Registrar.',[['co','Art. 11–12'],['dmp','Art. 16'],['pr','Art. 13–20']],'Companies Regs let the Registrar refuse without reasons. Operating Regs Art. 66 and DMP Art. 28 require reasons. Align the rule.'],
['rw1','st2','Certificate of Permitted Activities','10 business days','F',0,'Names the principal and any additional activities; can apply together with incorporation.','Matches activities to the List, sets conditions, records Activity Endorsements, notes any other regulator\'s licence.','Decision within 10 business days of completeness (Certificates Rules). Certificate valid 12–36 months, 12 by default.','Registrar.',[['ce','Art. 7–9, 13–18, Part 4'],['pa','Art. 6–8'],['op','Art. 9']],'Certificates Rules say 10 business days; DMP Art. 16(2) says 15. Confirm which prevails.'],
['rw1','st3','Office, email, public record','from day 1','F',0,'Keeps a registered office and email in the Center, runs principal business there and stays inside the Certificate.','Shows status and activities in the Public Register; serves notices electronically.','Ongoing.','Registrar.',[['op','Art. 13, 15, 18'],['pr','Art. 21, 24–25']]],
['rw1','st4','Renewal, Confirmation Statement, changes','30 days','F',0,'Renews before expiry with fee and Confirmation Statement; reports changes within 30 days; asks approval for a new activity.','Issues an updated Certificate; approves new activities.','30 days to report changes. Late renewal within 30 days of expiry: no fine; after: automatic fine.','Registrar; fines are applied by the Administration.',[['op','Art. 9(9)–(11), 16–17'],['ce','Art. 24, 34'],['pa','Art. 7(4)–(5)']]],
['rw1','st5','Inspection, directions, fines','10 business days notice','R',0,'Answers information requests, allows inspection, remedies breaches.','Issues directions, accepts undertakings, varies or suspends; prepares the case file for fines.','Written notice of variation, suspension or revocation within 10 business days.','Registrar for directions; Administration for fines and status; Court.',[['op','Art. 23–32, 37–39'],['dmp','Art. 7, 19–27']]],
['rw1','st6','Strike-off','3 months notice','R',0,'Winds up or applies for strike-off; keeps records for 6 years.','Publishes notice, allows 3 months to show cause, strikes off; the entity is dissolved.','3 months; records 6 years.','Registrar; Administration consent where the Resident holds a certification; Court restores.',[['op','Art. 33–34'],['co','Art. 151']]],

['rw2','st1','Incorporation as Holding Company','Part 11','A',0,'Incorporates as a Private Company that operates as a Holding Company.','As for any company; may ask for confirmations.','As for a Private Company.','Registrar.',[['co','Part 11']]],
['rw2','st2','Certificate: headquarters or IP holding','substance','A',0,'Declares headquarters (management and coordination) or IP holding activity and shows substance.','Checks substance proportionate to the purpose. Operations of foreign subsidiaries are not covered by the headquarters endorsement.','10 business days.','Registrar.',[['pa','Art. 6(9),(11), 9(5), 9(13)'],['ce','Art. 8–9']]],
